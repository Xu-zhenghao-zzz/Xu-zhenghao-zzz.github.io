short_bio: >-
  <p>
    I am an undergraduate student in Computer Science and Technology at the
    <a href="https://en.ustb.edu.cn/" target="_blank" rel="noopener">University of Science and Technology Beijing (USTB)</a>.
  </p>
  <p>
    My research experience spans reinforcement learning, graph learning, and multimodal AI.
    I have worked on PPO/GNN-based decision making and generalization experiments, multimodal video robustness evaluation, and large-scale video-QA dataset construction.
    I enjoy research that combines learning algorithms with hands-on implementation and careful experimentation.
  </p>

