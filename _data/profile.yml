short_bio: >-
  <p>
    I am an undergraduate student in Computer Science and Technology at the
    <a href="https://en.ustb.edu.cn/" target="_blank" rel="noopener">University of Science and Technology Beijing (USTB)</a>.
    My research focuses on intelligent networked systems and multimodal AI.
  </p>
  <p>
    I study topology-aware decision making for networks using deep reinforcement learning and graph neural networks,
    as well as data-centric and agentic systems for large multimodal models. I am especially interested in research
    that connects system measurement, learning, and deployable experimental pipelines.
  </p>

